<html lang="en">
<head>

<title>Then, machines made gods · Story atlas</title>
<style>
:root{color-scheme:dark;--bg:#101518;--panel:#171d21;--surface:#20292e;--ink:#f0eadb;--dim:#aab7b7;--line:#35454b;--gold:#edbb68;--teal:#72c9c4;--rose:#e48b80;--blue:#9baee0;--purple:#c4a1d6;--green:#a3c691;--event:var(--gold);--character:var(--rose);--machine:var(--teal);--artifact:var(--purple);--location:var(--blue);--faction:var(--green)}
*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--line);border-radius:6px;padding:7px 11px}
button,a,input,textarea,select{outline-offset:4px}button:focus-visible,a:focus-visible{outline:2px solid var(--gold)}
button:hover{background:var(--surface)}button.active,button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
button.primary{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:600}button.quiet{border-color:transparent}button.danger{color:var(--rose)}a{color:var(--teal)}
header{padding:22px 30px 17px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
h1{font-size:26px;line-height:1.2;letter-spacing:-.7px;margin:5px 0 7px;font-weight:650}h1 span{color:var(--gold)}

.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.draft{font-size:11px;color:var(--dim);display:block;margin-top:9px;text-align:right}
.bar{display:flex;gap:12px;align-items:center;padding:12px 30px;border-bottom:1px solid var(--line);flex-wrap:wrap}.tabs{display:flex;gap:4px;flex-wrap:wrap}.tabs button{border-color:transparent;padding:7px 12px}
.search-wrap{margin-left:auto;position:relative;width:230px}.search-wrap input{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px}
.results{position:absolute;right:0;top:43px;width:330px;max-height:420px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:20;box-shadow:0 12px 40px #0008}.results button{display:block;text-align:left;width:100%;border:0;border-radius:0;padding:10px 13px}.results small{display:block;color:var(--dim)}
.shell{display:grid;grid-template-columns:minmax(0,1fr) 370px;height:calc(100vh - 184px);min-height:640px}.map-panel{min-width:0;position:relative;display:flex;flex-direction:column}
.map-head{padding:18px 25px 12px;display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.map-head h2{font-size:16px;margin:3px 0 4px;font-weight:550}.map-head p{margin:0;color:var(--dim);font-size:12px;max-width:620px}
.map-tools{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end;min-width:230px}.map-tools button{font-size:12px;padding:5px 8px}
.subfilters{padding:0 25px 12px;display:flex;gap:5px;flex-wrap:wrap}.subfilters button{font-size:12px;padding:4px 9px}
.map{flex:1;position:relative;overflow:hidden;touch-action:none;background-image:radial-gradient(#53606666 .7px,transparent .7px);background-size:22px 22px;cursor:grab}.map.dragging{cursor:grabbing}.map-canvas{position:absolute;top:0;left:0;transform-origin:0 0}
.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}.edge{stroke:var(--line);stroke-width:1.6;fill:none;opacity:.32}.edge.hot{stroke:var(--gold);stroke-width:2;opacity:1}.edge.reference{stroke-dasharray:5 5}.edge-label{font-size:11px;fill:var(--gold);paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.node{position:absolute;width:222px;height:150px;text-align:left;border-radius:8px;border:1px solid #516168;background:var(--panel);padding:13px 14px;display:flex;flex-direction:column;gap:5px;box-shadow:0 7px 22px #0003;user-select:none;touch-action:none;overflow:hidden;cursor:grab}.node:hover{border-color:var(--kind);background:#253036}.node.selected{border:2px solid var(--kind);padding:12px 13px;background:#273136;box-shadow:0 0 0 4px #f0eadb0b}.node.faded{opacity:.74}
.node-top{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--kind)}.node-title{font-size:16px;line-height:1.2;font-weight:600;letter-spacing:-.2px}.node-sub{font-size:11px;line-height:1.35;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.node svg{width:20px;height:20px;flex:none}.node-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;color:var(--dim);font-size:10px}.node-foot .mark{height:4px;width:22px;background:var(--kind);border-radius:4px}
.mini{position:absolute;right:16px;bottom:45px;width:150px;height:110px;border:1px solid var(--line);border-radius:6px;background:#101518ed;cursor:crosshair}.mini rect.extent{fill:#f0eadb0a;stroke:var(--dim);stroke-width:1}
.map-footer{display:flex;justify-content:space-between;padding:9px 25px;border-top:1px solid var(--line);gap:10px;color:var(--dim);font-size:11px}.legend{display:flex;gap:12px;flex-wrap:wrap}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--kind);margin-right:4px}
.inspector{border-left:1px solid var(--line);background:var(--panel);overflow:auto}.inspect-top{padding:20px 23px 15px;border-bottom:1px solid var(--line)}.inspect-controls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.inspect-controls .tag{font-size:10px;letter-spacing:1.4px;color:var(--kind);text-transform:uppercase}.inspect-controls button{font-size:12px;padding:4px 9px}.inspector h2{font-size:25px;line-height:1.15;letter-spacing:-.6px;margin:9px 0}.inspector .subtitle{color:var(--dim);font-size:12px;margin:0 0 10px}
.vignette{height:145px;overflow:hidden;margin:14px -23px -15px;background:#10151866}.vignette svg{width:100%;height:100%;display:block}
.inspect-body{padding:18px 23px 30px}.inspect-body section{margin-bottom:21px}.inspect-body h3{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--kind,var(--dim));margin:0 0 6px;font-weight:600}.inspect-body p{margin:0;font-size:13px;line-height:1.6;color:#d9e0da}.inspect-body .secret{border-left:2px solid var(--kind);padding-left:12px}
.connections{display:flex;gap:6px;flex-wrap:wrap}.connections button{font-size:11px;padding:5px 8px;text-align:left}.connection-row{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;display:flex;align-items:center;gap:5px}.connection-row button{font-size:11px;padding:3px 6px}.connection-row span{color:var(--dim);flex:1}.small{font-size:11px;color:var(--dim)}.draft-note{font-size:11px;color:var(--dim);margin:0}
.edit-form label{display:block;font-size:11px;color:var(--dim);margin:15px 0 5px}.edit-form input,.edit-form textarea,.edit-form select{width:100%;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px;font-size:13px}.edit-form textarea{min-height:85px;resize:vertical;line-height:1.5}.edit-form select[multiple]{height:150px}.edit-actions{position:sticky;bottom:0;background:var(--panel);padding:14px 0;display:flex;gap:8px}
.question-pane{overflow:auto;padding:10px 25px 30px;flex:1;background:var(--bg)}.question-row{border-top:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:45px 1fr;gap:12px}.question-no{color:var(--gold);font-family:Georgia,serif;font-size:25px}.question-row h3{font-size:16px;margin:0 0 5px}.question-row p{color:var(--dim);margin:0 0 10px;max-width:620px}.question-row textarea{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:5px;padding:9px;min-height:65px;font:inherit}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:7px;z-index:100;box-shadow:0 5px 25px #0006;max-width:90vw}.error{color:var(--rose);font-size:12px;white-space:pre-line}
dialog{color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:25px;max-width:600px;width:calc(100% - 30px);max-height:85vh;overflow:auto}dialog::backdrop{background:#0009}dialog h2{margin:0 0 12px;font-size:22px}dialog .close{float:right}.rules li{margin-bottom:10px;color:var(--dim)}.dialog-row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.dialog-fields label{display:block;margin:12px 0 4px;color:var(--dim)}.dialog-fields select,.dialog-fields input{width:100%;padding:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:5px}
.empty{padding:60px 25px;color:var(--dim)}.zoom-label{font-size:11px;min-width:36px;text-align:center;color:var(--dim)}.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1050px){.shell{grid-template-columns:minmax(0,1fr) 320px}.bar,header{padding-left:20px;padding-right:20px}.top-actions button{font-size:12px}.search-wrap{width:185px}.map-head{flex-wrap:wrap}.map-tools{justify-content:flex-start}.inspect-top,.inspect-body{padding-left:18px;padding-right:18px}.vignette{margin-left:-18px;margin-right:-18px}.hook{font-size:13px}h1{font-size:23px}}
@media(max-width:760px){header{padding:18px 16px;display:block}.top-actions{justify-content:flex-start;margin-top:15px}.draft{text-align:left}.bar{padding:10px 12px;gap:8px}.tabs{gap:0}.tabs button{font-size:12px;padding:6px 9px}.search-wrap{width:100%;margin:0}.results{width:100%}.shell{height:auto;min-height:0;display:flex;flex-direction:column}.map-panel{height:670px}.inspector{border-left:0;border-top:1px solid var(--line);overflow:visible}.inspect-top{position:relative}.vignette{max-width:none;height:160px}.map-head{padding:15px 16px}.map-footer{padding:9px 16px;flex-wrap:wrap}.subfilters{padding-left:16px}.mini{width:110px;height:80px}.question-pane{padding:5px 16px 20px}.top-actions button{padding:6px 9px}h1{font-size:25px}}
@media print{header,.bar,.map-head,.map-footer,.mini,.inspector,.map-tools{display:none}.shell,.map-panel,.map{height:auto;overflow:visible}.map-canvas{position:relative;transform:scale(.45)!important;transform-origin:top left}.node{box-shadow:none}body{background:var(--bg);print-color-adjust:exact}}
</style>

<body>
<header>
 <div><div class="eyebrow">A world to uncover · an original story in progress</div><h1>Then, machines <span>made gods.</span></h1><p class="hook" id="hook"></p></div>
 <div><div class="top-actions"><button id="about">Story premise</button><button id="import">Open revision</button><button id="export-json">Save story data</button><button class="primary" id="save">Save editable atlas</button></div><span class="draft" id="save-status">Draft 0.1 · all story elements proposed</span></div>
</header>
<div class="bar"><nav class="tabs" aria-label="Story views" id="tabs"></nav><div class="search-wrap"><label class="visually-hidden" for="search">Find a person, event, place, or machine</label><input id="search" type="search" placeholder="Find anything in the story…" autocomplete="off"><div class="results" id="results" hidden></div></div></div>
<main class="shell">
 <section class="map-panel" aria-label="Visual story map">
  <div class="map-head"><div><div class="eyebrow" id="view-label"></div><h2 id="view-title"></h2><p id="view-description"></p></div><div class="map-tools" id="map-tools"><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label" class="zoom-label">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="fit">Fit map</button><button id="focus">Focus selection</button><button id="add">+ Card</button><button id="connect">+ Arrow</button></div></div>
  <div class="subfilters" id="subfilters" hidden></div>
  <div class="map" id="map" aria-label="Pan and zoom the story. Select a card to inspect or edit it."><div id="canvas" class="map-canvas"></div><svg id="mini" class="mini" role="img" aria-label="Map overview; select a position to navigate"></svg></div>
  <div id="questions" class="question-pane" hidden></div>
  <div class="map-footer"><div class="legend" id="legend"></div><span id="map-status">Drag the background to pan · scroll to travel · Ctrl/⌘ scroll to zoom</span></div>
 </section>
 <aside class="inspector" id="inspector" aria-label="Selected story element"></aside>
</main>
<dialog id="dialog"></dialog><input id="file" type="file" accept=".json,.html" hidden><div id="toast" class="toast" role="status" hidden></div>
<script id="story-data" type="application/json">__STORY_DATA__</script>
<script>
'use strict';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const kinds=['event','character','machine','artifact','location','faction'];
const names={event:'Event',character:'Person',machine:'Machine',artifact:'Artifact',location:'Place',faction:'Faction'};
const tabs=[['spine','Story spine'],['history','History'],['campaign','Campaign'],['cast','Cast'],['world','World'],['questions','Open questions']];
let data=JSON.parse($('story-data').textContent), view='spine',worldKind='machine',selected='h04',editing=false,focusOnly=false,positions={},shown=[],mapBounds={w:1000,h:1000},camera={x:30,y:25,z:.9},gesture=null,dirty=false;
const STORAGE='machines-made-gods-story-atlas-v1';
let storageWorks=true;
try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(saved?.schemaVersion===1&&saved.updatedAt>(data.updatedAt||0)){validate(saved);data=saved;setTimeout(()=>toast('Restored your newer local edits.'),200)}}catch(e){storageWorks=false}
function byId(id){return data.nodes.find(n=>n.id===id)}
function related(id){const n=byId(id);return new Set([id,...(n?.links||[]),...data.nodes.filter(x=>x.links.includes(id)).map(x=>x.id),...data.edges.filter(e=>e.source===id||e.target===id).flatMap(e=>[e.source,e.target])])}
function toast(msg){$('toast').textContent=msg;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3200)}
function changed(){dirty=true;data.updatedAt=Date.now();try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){storageWorks=false}status()}
function status(){const pending=data.nodes.filter(n=>n.status==='Proposed').length;$('save-status').textContent=dirty?(storageWorks?'Edits kept in this browser · Save editable atlas to keep a file':'Browser storage unavailable · Save editable atlas to keep changes'):`Draft ${data.version} · ${pending} proposed elements`}
function validate(d){if(!d||d.schemaVersion!==1||!Array.isArray(d.nodes)||!Array.isArray(d.edges)||!Array.isArray(d.overview)||!Array.isArray(d.questions)||!Array.isArray(d.designRules))throw Error('This file is not a supported story atlas.');const ids=new Set();for(const n of d.nodes){if(!n.id||ids.has(n.id)||!kinds.includes(n.kind)||!Array.isArray(n.links)||typeof n.title!=='string')throw Error('Every card needs a unique ID, a valid type, a title, and a link list.');ids.add(n.id)}for(const n of d.nodes)if(n.links.some(id=>!ids.has(id)))throw Error('A card references an unknown card.');if(d.overview.some(id=>!ids.has(id)))throw Error('The story spine references an unknown card.');for(const e of d.edges){if(!ids.has(e.source)||!ids.has(e.target))throw Error('An arrow references an unknown card.');if(d.nodes.find(n=>n.id===e.source).kind!=='event'||d.nodes.find(n=>n.id===e.target).kind!=='event')throw Error('Causal arrows must connect events.')}assertDAG(d.edges,ids)}
function assertDAG(es,ids=new Set(data.nodes.map(n=>n.id))){const degree=new Map([...ids].map(id=>[id,0]));for(const e of es)degree.set(e.target,degree.get(e.target)+1);const q=[...ids].filter(id=>degree.get(id)===0);let count=0;while(q.length){const id=q.shift();count++;for(const e of es.filter(e=>e.source===id)){degree.set(e.target,degree.get(e.target)-1);if(degree.get(e.target)===0)q.push(e.target)}}if(count!==ids.size)throw Error('This arrow would create a causal loop. Connect events in the direction they cause one another. Repeating history is represented by separate later events.')}
function glyph(kind){const shape={event:'<path d="M4 15 10 5l3 6 4-2 3 10H4Z"/><circle cx="18" cy="5" r="2"/>',character:'<circle cx="12" cy="7" r="4"/><path d="M4 21v-3a8 8 0 0 1 16 0v3M12 11v10"/>',machine:'<path d="M5 7h14v12H5zM9 7V3h6v4M2 11h3m14 0h3M8 19v3m8-3v3"/><circle cx="12" cy="13" r="2"/>',artifact:'<path d="m12 2 7 10-7 10-7-10Z"/><path d="M5 12h14M12 2v20"/>',location:'<path d="M4 21V9l8-7 8 7v12M8 21v-7h8v7M2 21h20"/>',faction:'<path d="M5 22V3h14l-3 5 3 5H5M9 17h10"/>'}[kind];return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">${shape}</svg>`}
function vignette(n){const color=`var(--${n.kind})`;let s='';if(n.kind==='character'){s='<path d="M145 145q-6-49 30-68 36 19 30 68M162 78q-19-21-6-45 19-22 38 0 13 24-6 45"/><path d="M175 28v112M128 145l21-51m73 51-21-51" opacity=".5"/>';if(['c04','c07','c11'].includes(n.id))s+='<path d="M156 28l35 14-28 18 27 19-22 18 31 22" stroke-dasharray="3 5"/>'}
else if(n.kind==='artifact')s='<ellipse cx="175" cy="76" rx="80" ry="49"/><ellipse cx="175" cy="76" rx="43" ry="61"/><path d="m175 34 20 42-20 35-20-35Z"/><path d="M50 76h84m82 0h84" stroke-dasharray="4 7"/>';
else if(n.id==='m08'||n.id==='m09'||n.id==='m10'||n.id==='h09'||n.id==='p01')s='<path d="M149 145V89l-30-12 14-24 27 6V37h30v22l27-6 14 24-30 12v56M160 66h30v51h-30ZM119 77l-13 42 29 7m96-49 13 42-29 7M164 37V25h22v12"/><circle cx="175" cy="91" r="9"/><path d="M165 117v28m20-28v28"/>';
else if(n.id==='m11'||n.id==='p06')s='<path d="M175 130V44m0 34Q118 20 43 31q12 55 108 78m24-31Q232 20 307 31q-12 55-108 78M153 62l-80-14m124 14 80-14M154 81l-61-8m103 8 61-8"/><ellipse cx="175" cy="34" rx="29" ry="8"/><circle cx="175" cy="66" r="13"/>';
else if(n.id==='h07'||n.id==='l03'||n.id==='p09')s='<path d="m36 59 101-20 28 20-21 31-108-7ZM187 62l29-20 103 17v24l-105 7ZM144 39l23-17m21 40-12 22m-28 22-18 22m84-25 16 22"/><path d="M18 138q157-74 314 0"/>';
else if(n.id==='h04'||n.id==='m01'||n.id==='l08'||n.id==='p11')s='<path d="M81 126V54l40 31 54-60 54 60 40-31v72ZM81 126h188M121 85v41m54-101v101m54-41v41"/><circle cx="175" cy="93" r="19"/>';
else if(n.kind==='location'||n.id==='h11'||n.id==='h13'||n.id==='p03')s='<path d="M37 137V93h25V60h29v77M112 137V41h35v96M164 137V72h36v65M222 137V24h33v113M278 137V85h31v52M20 138h310"/><path d="M12 111q22-12 44 0t44 0t44 0t44 0t44 0t44 0t44 0" opacity=".5"/>';
else if(n.id==='m03'||n.id==='h18')s='<path d="M175 23 249 52v42q-9 28-74 48-65-20-74-48V52ZM175 23v119M101 75h148"/><circle cx="175" cy="77" r="22"/>';
else if(n.id==='p12')s='<path d="M25 133h300M65 133V78h39v55M68 78V58h33v20M85 58V27M192 133V69l39-29 39 29v64M206 133V89h48v44"/><path d="M16 118q159-139 318 0M29 118q146-119 292 0" opacity=".6"/>';
else if(n.kind==='faction')s='<path d="M118 143V24h122l-24 37 24 37H118M146 143V98M174 24v74"/><circle cx="174" cy="61" r="17"/>';
else s='<path d="M119 140V55l56-33 56 33v85M142 140V72h66v68M175 22v118"/><circle cx="175" cy="70" r="18"/><path d="M65 139h220M74 115l28-28m174 28-28-28"/>';
return `<svg viewBox="0 0 350 150" role="img" aria-label="${esc(n.visual)}"><defs><pattern id="grid-${esc(n.id)}" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="${color}" stroke-opacity=".09"/></pattern></defs><rect width="350" height="150" fill="url(#grid-${esc(n.id)})"/><circle cx="175" cy="77" r="64" fill="${color}" fill-opacity=".04"/><g fill="none" stroke="${color}" stroke-width="1.5">${s}</g><path d="M10 139h330" stroke="${color}" stroke-opacity=".2"/></svg>`}
function listForView(){if(view==='spine')return data.overview.map(byId).filter(Boolean);if(view==='history')return data.nodes.filter(n=>n.kind==='event'&&n.id.startsWith('h')).sort((a,b)=>(a.era??0)-(b.era??0));if(view==='campaign')return data.nodes.filter(n=>n.kind==='event'&&!n.id.startsWith('h')).sort((a,b)=>(a.era??0)-(b.era??0));if(view==='cast')return data.nodes.filter(n=>n.kind==='character');if(view==='world')return data.nodes.filter(n=>n.kind===worldKind);return []}
function getLayout(ns){const result={},cols=3;ns.forEach((n,i)=>{let x=34+(i%cols)*264,y=48+Math.floor(i/cols)*202;if(view==='history'){x=34+(n.lane??0)*264;y=48+i*175}const saved=data.layout?.[view+(view==='world'?worldKind:'')]?.[n.id];result[n.id]=saved||{x,y}});return result}
function projectedEdges(ids){const visible=new Set(ids);if(view==='cast'||view==='world'){const out=[];for(const n of shown)for(const id of n.links)if(visible.has(id)&&n.id<id)out.push({source:n.id,target:id,label:'associated',reference:true});return out}const out=[],seen=new Set();for(const source of ids){const queue=data.edges.filter(e=>e.source===source).map(e=>({id:e.target,label:e.label,via:false}));const visited=new Set();while(queue.length){const p=queue.shift();if(visited.has(p.id))continue;visited.add(p.id);if(visible.has(p.id)){const key=source+'>'+p.id;if(!seen.has(key)){seen.add(key);out.push({source,target:p.id,label:p.via?'through intervening events':p.label,via:p.via})}}else for(const e of data.edges.filter(e=>e.source===p.id))queue.push({id:e.target,label:p.label,via:true})}}return out}
function drawEdges(){const svg=$('edges');if(!svg)return;const ns=new Set(shown.map(n=>n.id));const es=projectedEdges([...ns]);let html='<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--line)"/></marker><marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--gold)"/></marker></defs>';
for(const e of es){const a=positions[e.source],b=positions[e.target];if(!a||!b)continue;let x1,y1,x2,y2,path;if(Math.abs(a.y-b.y)<80){const right=b.x>a.x;x1=a.x+(right?222:0);y1=a.y+74;x2=b.x+(right?0:222);y2=b.y+74;const bend=Math.max(20,Math.abs(x2-x1)*.45);path=`M${x1},${y1}C${x1+(right?bend:-bend)},${y1} ${x2-(right?bend:-bend)},${y2} ${x2},${y2}`}
else{x1=a.x+111;y1=a.y+150;x2=b.x+111;y2=b.y;const bend=Math.max(24,Math.abs(y2-y1)*.45);path=`M${x1},${y1}C${x1},${y1+bend} ${x2},${y2-bend} ${x2},${y2}`}
const hot=e.source===selected||e.target===selected;html+=`<path class="edge${hot?' hot':''}${e.reference?' reference':''}" d="${path}" ${e.reference?'':`marker-end="url(#${hot?'arrow-hot':'arrow'})"`}/>`;if(hot&&!e.via&&!e.reference&&Math.abs(y2-y1)>40){const label=e.label.length>34?e.label.slice(0,31)+'…':e.label;html+=`<text class="edge-label" x="${(x1+x2)/2}" y="${(y1+y2)/2-6}" text-anchor="middle">${esc(label)}</text>`}}
svg.innerHTML=html}
function updateCamera(){camera.z=Math.max(.2,Math.min(1.8,camera.z));$('canvas').style.transform=`translate(${camera.x}px,${camera.y}px) scale(${camera.z})`;$('zoom-label').textContent=Math.round(camera.z*100)+'%';drawMini()}
function drawMini(){const el=$('mini');if(!shown.length){el.innerHTML='';return}el.setAttribute('viewBox',`0 0 ${mapBounds.w} ${mapBounds.h}`);el.innerHTML=shown.map(n=>{const p=positions[n.id];return `<rect x="${p.x}" y="${p.y}" width="222" height="150" rx="8" fill="var(--${n.kind})" opacity="${n.id===selected?1:.45}"/>`}).join('')+`<rect class="extent" x="${-camera.x/camera.z}" y="${-camera.y/camera.z}" width="${$('map').clientWidth/camera.z}" height="${$('map').clientHeight/camera.z}"/>`}
function fit(){camera.z=Math.min(1.1,($('map').clientWidth-50)/mapBounds.w,($('map').clientHeight-40)/mapBounds.h);camera.x=($('map').clientWidth-mapBounds.w*camera.z)/2;camera.y=20;updateCamera()}
function frameNode(id){const p=positions[id];if(!p)return;camera.z=Math.max(.8,Math.min(1.15,($('map').clientWidth-30)/250));camera.x=$('map').clientWidth/2-(p.x+111)*camera.z;camera.y=$('map').clientHeight/2-(p.y+75)*camera.z;updateCamera()}
function setView(v,frame=false){view=v;focusOnly=false;editing=false;renderMap(true);if(frame&&positions[selected])frameNode(selected)}
function renderMap(reset=false){$('hook').textContent=data.hook;$('tabs').innerHTML=tabs.map(([id,label])=>`<button type="button" data-view="${id}" class="${id===view?'active':''}" aria-pressed="${id===view}">${label}</button>`).join('');const configs={spine:['THE CAUSAL SPINE','From the first makers to the first free morning','A condensed causal map. Select a card for its truth, stakes, and connections. All names and events are a proposed draft.'],history:['THE HIDDEN HISTORY','What really happened','Historical events in chronological order. Arrows trace causes; different eras of recurrence remain separate events.'],campaign:['THE PLAYER’S JOURNEY','What players do—and what each discovery changes','A complete five-act campaign, finale, and epilogue. Inspect cards for playable actions and revelations.'],cast:['THE PEOPLE','Inherited lives. Present choices.','Original people and their later continuations are separate cards. Dotted lines are associations, not causal arrows.'],world:['THE WORLD','The things people worship, inhabit, and rebuild','Select a category, then inspect its roles, history, fate, and connected events.'],questions:['STORY DECISIONS','The parts we can still change','Record decisions here. They travel with your saved atlas; the story cards remain editable.']};const c=configs[view];$('view-label').textContent=c[0];$('view-title').textContent=c[1];$('view-description').textContent=c[2];$('map').hidden=view==='questions';$('questions').hidden=view!=='questions';$('map-tools').hidden=view==='questions';$('subfilters').hidden=view!=='world';$('subfilters').innerHTML=['machine','artifact','location','faction'].map(k=>`<button data-kind="${k}" aria-pressed="${worldKind===k}">${({machine:'Machines & gods',artifact:'Artifacts',location:'Places',faction:'Factions'})[k]}</button>`).join('');$('legend').innerHTML=kinds.map(k=>`<span style="--kind:var(--${k})"><i class="dot"></i>${names[k]}</span>`).join('');
if(view==='questions'){renderQuestions();$('map-status').textContent='Decision notes are included in every saved revision.';renderInspector();return}
shown=listForView();if(focusOnly){const ids=related(selected);shown=shown.filter(n=>ids.has(n.id))}positions=getLayout(shown);mapBounds={w:Math.max(800,...Object.values(positions).map(p=>p.x+260)),h:Math.max(300,...Object.values(positions).map(p=>p.y+190))};$('canvas').style.width=mapBounds.w+'px';$('canvas').style.height=mapBounds.h+'px';$('canvas').innerHTML=`<svg class="edges" id="edges" width="${mapBounds.w}" height="${mapBounds.h}" aria-label="Story connections"></svg>`+shown.map(n=>{const p=positions[n.id];return `<button type="button" class="node${n.id===selected?' selected':''}" data-id="${esc(n.id)}" style="left:${p.x}px;top:${p.y}px;--kind:var(--${n.kind})" aria-label="${esc(names[n.kind]+': '+n.title+'. '+n.subtitle)}"><span class="node-top">${glyph(n.kind)}${esc(n.kind==='event'?(n.chapter||'Event'):names[n.kind])}</span><span class="node-title">${esc(n.title)}</span><span class="node-sub">${esc(n.subtitle)}</span><span class="node-foot"><span>${esc(n.status||'Proposed')}</span><i class="mark"></i></span></button>`}).join('');drawEdges();highlight();$('map-status').textContent=`${shown.length} cards · drag cards to arrange · drag background to pan`;$('focus').setAttribute('aria-pressed',focusOnly);if(reset){camera={x:20,y:20,z:Math.min(1,($('map').clientWidth-35)/mapBounds.w)};}updateCamera();renderInspector()}
function highlight(){const ids=related(selected);for(const el of document.querySelectorAll('.node')){el.classList.toggle('selected',el.dataset.id===selected);el.classList.toggle('faded',!ids.has(el.dataset.id)&&view!=='cast'&&view!=='world')}drawEdges();drawMini()}
function select(id,travel=false){if(!byId(id))return;selected=id;editing=false;if(travel&&!shown.some(n=>n.id===id)){const n=byId(id);if(n.kind==='event')view=n.id.startsWith('h')?'history':'campaign';else if(n.kind==='character')view='cast';else{view='world';worldKind=n.kind}focusOnly=false;renderMap(true)}else{highlight();renderInspector()}if(travel)frameNode(id)}
function section(label,value,cls=''){return value?`<section class="${cls}"><h3>${esc(label)}</h3><p>${esc(value)}</p></section>`:''}
function renderInspector(){const n=byId(selected);if(!n){$('inspector').innerHTML='<div class="empty">Select a story card.</div>';return}if(editing){renderEdit(n);return}const linkIds=[...new Set([...n.links,...data.nodes.filter(x=>x.links.includes(n.id)).map(x=>x.id)])];const es=data.edges.filter(e=>e.source===n.id||e.target===n.id);$('inspector').style.setProperty('--kind',`var(--${n.kind})`);$('inspector').innerHTML=`<div class="inspect-top"><div class="inspect-controls"><span class="tag">${names[n.kind]} · ${esc(n.status||'Proposed')}</span><button id="edit">Edit card</button></div><h2>${esc(n.title)}</h2><p class="subtitle">${esc(n.subtitle)}</p>${n.role?`<p class="small">${esc(n.role)}</p>`:''}<div class="vignette">${vignette(n)}</div></div><div class="inspect-body">${section('The visible story',n.summary)}${section('What is really happening',n.truth,'secret')}${section('Why it matters',n.stakes)}${section('Playable action',n.play)}${section('The revelation',n.reveal)}${section('What they want',n.desire)}${section('Character / system arc',n.arc)}${section('End state',n.fate)}${section('Visual direction',n.visual)}${section('Recurring motif',n.motif)}${section('Our notes',n.notes)}${es.length?`<section><h3>Causal connections</h3>${es.map(e=>`<div class="connection-row"><button data-go="${esc(e.source===n.id?e.target:e.source)}">${e.source===n.id?'→':'←'} ${esc(byId(e.source===n.id?e.target:e.source)?.title)}</button><span>${esc(e.label)}</span></div>`).join('')}</section>`:''}${linkIds.length?`<section><h3>Connected people, places & objects</h3><div class="connections">${linkIds.map(id=>byId(id)).filter(Boolean).map(x=>`<button data-go="${esc(x.id)}"><i class="dot" style="--kind:var(--${x.kind})"></i>${esc(x.title)}</button>`).join('')}</div></section>`:''}<p class="draft-note">${esc(n.id)} · This element is proposed. Edit freely, then save a revision.</p></div>`}
const fields=[['title','Name / event title'],['subtitle','Short caption / date'],['summary','Visible story'],['truth','Underlying truth'],['stakes','Why it matters'],['role','Role'],['desire','Desire / purpose'],['arc','Arc'],['fate','End state'],['visual','Visual direction'],['motif','Motif'],['chapter','Chapter / era label'],['play','Playable action'],['reveal','Revelation'],['notes','Our notes']];
function renderEdit(n){$('inspector').innerHTML=`<div class="inspect-top"><div class="eyebrow">Editing ${esc(n.id)}</div><h2>${esc(n.title)}</h2><p class="small">Edits update this atlas. Save an editable atlas to keep a portable revision.</p></div><div class="inspect-body"><form id="edit-form" class="edit-form"><label for="edit-status">Decision status</label><select id="edit-status"><option${n.status==='Proposed'?' selected':''}>Proposed</option><option${n.status==='Agreed'?' selected':''}>Agreed</option><option${n.status==='Rework'?' selected':''}>Rework</option></select>${fields.map(([key,label])=>`<label for="field-${key}">${label}</label>${['title','subtitle','role','motif','chapter'].includes(key)?`<input id="field-${key}" name="${key}" value="${esc(n[key]||'')}"${key==='title'?' required':''}>`:`<textarea id="field-${key}" name="${key}">${esc(n[key]||'')}</textarea>`}`).join('')}${n.kind==='event'?`<label for="edit-era">Chronology order (for layout)</label><input id="edit-era" type="number" step="any" value="${n.era??30}"><label for="edit-lane">History lane</label><select id="edit-lane"><option value="0"${n.lane===0?' selected':''}>Machines / infrastructure</option><option value="1"${n.lane===1?' selected':''}>People / memory</option><option value="2"${n.lane===2?' selected':''}>Civilization / institutions</option></select>`:''}<label for="edit-links">Associated cards (⌘ / Ctrl to select several)</label><select id="edit-links" multiple>${data.nodes.filter(x=>x.id!==n.id).map(x=>`<option value="${esc(x.id)}"${n.links.includes(x.id)?' selected':''}>${esc(names[x.kind]+' · '+x.title)}</option>`).join('')}</select><p class="small">Associations are references. Use + Arrow to edit event causation.</p><div class="error" id="edit-error"></div><div class="edit-actions"><button type="submit" class="primary">Apply edits</button><button type="button" id="cancel-edit">Cancel</button><button type="button" id="remove-card" class="danger">Remove</button></div></form></div>`}
function applyEdit(){const n=byId(selected);for(const [key]of fields)n[key]=$('field-'+key).value.trim();n.status=$('edit-status').value;n.links=[...$('edit-links').selectedOptions].map(o=>o.value);if(n.kind==='event'){n.era=Number($('edit-era').value);n.lane=Number($('edit-lane').value)}changed();editing=false;renderMap();toast('Card updated. Save a revision when ready.')}
function renderQuestions(){$('questions').innerHTML=data.questions.map((q,i)=>`<div class="question-row"><div class="question-no">${String(i+1).padStart(2,'0')}</div><div><h3>${esc(q.title)}</h3><p>${esc(q.text)}</p><div class="connections">${q.links.map(id=>byId(id)).filter(Boolean).map(n=>`<button data-go="${esc(n.id)}">${esc(n.title)}</button>`).join('')}</div><label class="visually-hidden" for="question-${i}">Decision for ${esc(q.title)}</label><textarea id="question-${i}" data-question="${i}" placeholder="Our decision / alternatives…" style="margin-top:12px">${esc(q.notes||'')}</textarea></div></div>`).join('')}

function about(){showDialog(`<div class="eyebrow">Working title · ${esc(data.workingTitle)}</div><h2>${esc(data.title)}</h2><p>${esc(data.premise)}</p><p style="color:var(--gold);font-family:Georgia,serif;font-size:19px">${esc(data.theme)}</p><p class="small">${esc(data.note)}</p><h3>Story rules</h3><ul class="rules">${data.designRules.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>Working with the atlas</h3><p>Select a card to inspect it. Edit its name, role, history, fate, or notes. Drag cards to arrange a view. Add cards and causal arrows as the story changes. Arrows are checked for cycles.</p><p>Edits are kept in this browser where supported. <strong>Save editable atlas</strong> downloads a self-contained revision with your changes embedded. <strong>Save story data</strong> exports the underlying story as JSON. Open either format with <strong>Open revision</strong>.</p><p class="small">Everything runs locally. No account, network, or external library is needed.</p>`)}
function addCard(){showDialog(`<h2>Add a story card</h2><form id="add-form" class="dialog-fields"><label for="new-kind">Kind</label><select id="new-kind">${kinds.map(k=>`<option value="${k}">${names[k]}</option>`).join('')}</select><label for="new-title">Name</label><input id="new-title" required placeholder="A person, event, place, or object"><label for="new-period">For events</label><select id="new-period"><option value="p">Present campaign</option><option value="h">Historical event</option></select><div class="dialog-row"><button class="primary" type="submit">Create card</button><button type="button" data-close>Cancel</button></div></form>`);$('new-kind').value=view==='cast'?'character':view==='world'?worldKind:'event'}
function createCard(){const kind=$('new-kind').value;let id=(kind==='event'?$('new-period').value:kind.slice(0,1))+'-'+Date.now().toString(36);const n={id,kind,title:$('new-title').value.trim(),subtitle:'New story element',summary:'',truth:'',stakes:'',visual:'',links:[],status:'Proposed'};if(kind==='event'){n.era=Math.max(...data.nodes.filter(x=>x.kind==='event').map(x=>x.era||0))+1;n.lane=1;data.overview.push(id)}data.nodes.push(n);changed();$('dialog').close();selected=id;if(kind==='event')view=id.startsWith('h')?'history':'campaign';else if(kind==='character')view='cast';else{view='world';worldKind=kind}focusOnly=false;renderMap(true);frameNode(id);editing=true;renderInspector()}
function arrowDialog(){const events=data.nodes.filter(n=>n.kind==='event');showDialog(`<h2>Causal arrows</h2><p class="small">An arrow means the source event helps cause the target. Associations belong in a card’s editor. Cycles are rejected.</p><form id="arrow-form" class="dialog-fields"><label for="arrow-source">Cause</label><select id="arrow-source">${events.map(n=>`<option value="${esc(n.id)}"${n.id===selected?' selected':''}>${esc(n.title)}</option>`).join('')}</select><label for="arrow-target">Consequence</label><select id="arrow-target">${events.map(n=>`<option value="${esc(n.id)}">${esc(n.title)}</option>`).join('')}</select><label for="arrow-label">Connection label</label><input id="arrow-label" required placeholder="Why does this lead to that?"><div id="arrow-error" class="error"></div><div class="dialog-row"><button class="primary" type="submit">Add arrow</button></div></form><h3>Existing connections for this card</h3><div id="arrow-list">${data.edges.map((e,i)=>({...e,i})).filter(e=>e.source===selected||e.target===selected).map(e=>`<div class="connection-row"><span>${esc(byId(e.source)?.title)} → ${esc(byId(e.target)?.title)}<br>${esc(e.label)}</span><button class="danger" data-delete-edge="${e.i}">Remove</button></div>`).join('')||'<p class="small">No causal arrows on the selected card.</p>'}</div>`)}
function addArrow(){const e={source:$('arrow-source').value,target:$('arrow-target').value,label:$('arrow-label').value.trim()};try{if(data.edges.some(x=>x.source===e.source&&x.target===e.target))throw Error('That arrow already exists. Remove it before replacing its label.');assertDAG([...data.edges,e]);data.edges.push(e);changed();$('dialog').close();renderMap();toast('Causal arrow added.')}catch(err){$('arrow-error').textContent=err.message}}

function exportHTML(){if(editing){toast('Apply or cancel the open card edit before saving.');return}data.updatedAt=Date.now();const clone=document.documentElement.cloneNode(true);clone.querySelector('#story-data').textContent=JSON.stringify(data,null,2).replace(/</g,'\\u003c');clone.querySelector('#dialog').removeAttribute('open');clone.querySelector('#dialog').innerHTML='';clone.querySelector('#toast').hidden=true;clone.querySelector('#results').hidden=true;clone.querySelector('#search').value='';download('machines-made-gods-atlas.html','<!doctype html>\n'+clone.outerHTML,'text/html');dirty=false;status();toast('Editable atlas saved with the current story embedded.')}
async function importFile(file){try{const text=await file.text();let d;if(file.name.toLowerCase().endsWith('.html')){const doc=new DOMParser().parseFromString(text,'text/html');const embedded=doc.querySelector('#story-data');if(!embedded)throw Error('No story data found in this atlas.');d=JSON.parse(embedded.textContent)}else d=JSON.parse(text);validate(d);if(dirty&&!confirm('Replace the current story with this revision? Save the current atlas first if you want to retain it.'))return;data=d;selected=data.overview[0]||data.nodes[0]?.id;editing=false;view='spine';focusOnly=false;changed();renderMap(true);toast('Revision opened.')}catch(err){toast(err.message)}$('file').value=''}

$('map').addEventListener('wheel',e=>{if(e.target.closest('.mini'))return;e.preventDefault();if(e.ctrlKey||e.metaKey){const r=$('map').getBoundingClientRect();zoom(Math.exp(-e.deltaY*.006),e.clientX-r.left,e.clientY-r.top)}else{camera.x-=e.deltaX;camera.y-=e.deltaY;updateCamera()}},{passive:false});
$('map').addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.mini'))return;const el=e.target.closest('.node');gesture={id:el?.dataset.id,startX:e.clientX,startY:e.clientY,x:camera.x,y:camera.y,moved:false,pos:el?{...positions[el.dataset.id]}:null};$('map').setPointerCapture(e.pointerId);$('map').classList.add('dragging')});
$('map').addEventListener('pointermove',e=>{if(!gesture)return;const dx=e.clientX-gesture.startX,dy=e.clientY-gesture.startY;if(Math.abs(dx)+Math.abs(dy)>5)gesture.moved=true;if(!gesture.moved)return;if(gesture.id){const p=positions[gesture.id];p.x=Math.max(5,gesture.pos.x+dx/camera.z);p.y=Math.max(5,gesture.pos.y+dy/camera.z);const el=[...document.querySelectorAll('.node')].find(x=>x.dataset.id===gesture.id);el.style.left=p.x+'px';el.style.top=p.y+'px';drawEdges();drawMini()}else{camera.x=gesture.x+dx;camera.y=gesture.y+dy;updateCamera()}});
$('map').addEventListener('pointerup',e=>{if(!gesture)return;if(gesture.id){if(gesture.moved){const key=view+(view==='world'?worldKind:'');data.layout||={};data.layout[key]||={};data.layout[key][gesture.id]={...positions[gesture.id]};changed()}else select(gesture.id)}gesture=null;$('map').classList.remove('dragging');if($('map').hasPointerCapture(e.pointerId))$('map').releasePointerCapture(e.pointerId)});
$('map').addEventListener('pointercancel',()=>{gesture=null;$('map').classList.remove('dragging')});
$('canvas').addEventListener('click',e=>{if(e.detail===0){const n=e.target.closest('.node');if(n)select(n.dataset.id)}});
$('mini').addEventListener('pointerdown',e=>{e.stopPropagation();const r=$('mini').getBoundingClientRect(),scale=Math.min(r.width/mapBounds.w,r.height/mapBounds.h),offX=(r.width-mapBounds.w*scale)/2,offY=(r.height-mapBounds.h*scale)/2;camera.x=$('map').clientWidth/2-((e.clientX-r.left-offX)/scale)*camera.z;camera.y=$('map').clientHeight/2-((e.clientY-r.top-offY)/scale)*camera.z;updateCamera()});
$('search').addEventListener('input',()=>{const q=$('search').value.trim().toLowerCase();if(!q){$('results').hidden=true;return}const matches=data.nodes.filter(n=>[n.title,n.subtitle,n.role,n.summary,n.truth].join(' ').toLowerCase().includes(q)).slice(0,18);$('results').innerHTML=matches.length?matches.map(n=>`<button data-search-id="${esc(n.id)}">${esc(n.title)}<small>${esc(names[n.kind]+' · '+n.subtitle)}</small></button>`).join(''):'<p class="small" style="padding:12px">No matching story element.</p>';$('results').hidden=false});
$('results').addEventListener('click',e=>{const el=e.target.closest('[data-search-id]');if(el){select(el.dataset.searchId,true);$('results').hidden=true;$('search').value=''}});
$('search').addEventListener('keydown',e=>{if(e.key==='Escape')$('results').hidden=true;if(e.key==='Enter'){const el=$('results').querySelector('button');if(el)el.click()}});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('results').hidden=true});
window.addEventListener('resize',()=>updateCamera());
window.addEventListener('beforeunload',e=>{if(editing){e.preventDefault();e.returnValue=''}});
validate(data);status();renderMap(true);
</script>
</body>
</html>
